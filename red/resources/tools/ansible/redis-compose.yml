# Redis 7.2 on the VPC address and loopback, nowhere else. The configuration
# file carries the password; the healthcheck reads it from that file so no
# credential sits in the container's environment or command line.
name: redis
services:
  redis:
    image: <{ redis-image }>
    restart: unless-stopped
    command: ["redis-server", "/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:<{ redis-port }>:6379"
      - "{{ vpc_ip }}:<{ redis-port }>:6379"
    volumes:
      - /opt/redis/redis.conf:/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$(sed -n 's/^requirepass //p' /etc/redis/redis.conf)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
volumes:
  redis-data:
