# The `~/.ssh/config` block, per the workspace SSH Config Standard.
#
# One managed block carries every alias this deployment owns: the bare profile,
# which reaches the app host and is what the standard promises an operator can
# type, and one alias per machine, because operating six machines means
# reaching one specific machine. The addresses arrive as extra-vars — they are
# run-time facts, and keeping them out of the rendered playbook is what makes
# the committed goldens identical on every workstation (§6). The one Selmer
# conditional is the IdentityFile pair, because whether the package owns a key
# is desired state that a build does know.
- name: Manage the deployment's ssh config block
  hosts: local
  gather_facts: false
  tasks:
    - name: Ensure ~/.ssh exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.ssh"
        state: directory
        mode: "0700"
      when: block_state == "present"

    - name: Write the managed block
      ansible.builtin.blockinfile:
        path: "{{ lookup('env', 'HOME') }}/.ssh/config"
        create: true
        mode: "0600"
        marker: "# {mark} {{ host_alias }} ANSIBLE MANAGED BLOCK"
        # ssh_config takes the first value it obtains, and blockinfile
        # appends. A Host * stanza above this block would win on User and
        # IdentityFile, so the block goes first (§5). Options standing above
        # the first Host line would be captured into this stanza by a BOF
        # insert, so the package refuses to run against such a file.
        insertbefore: BOF
        state: "{{ block_state }}"
        block: |
          {% for host in ssh_hosts %}
          Host {{ host.name }}
              HostName {{ host.ip }}
              User root
              Port 22
<% if ssh-keygen %>              IdentityFile <{ ssh-config-identity-file }>
              IdentitiesOnly yes
<% endif %>              StrictHostKeyChecking accept-new
              ForwardAgent no
          {% endfor %}
